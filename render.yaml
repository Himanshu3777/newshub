services:
  - type: web
    name: newsverify-ai
    env: python
    buildCommand: ./build.sh
    startCommand: gunicorn newsverify.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4
    envVars:
      - key: DEBUG
        value: "False"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_FACTCHECK_API_KEY
        sync: false
