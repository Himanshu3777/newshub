services:
  - type: web
    name: newsverify-ai
    env: python
    plan: free
    buildCommand: ./build.sh
    healthCheckPath: /health/
    startCommand: gunicorn newsverify.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4
    envVars:
      - key: DEBUG
        value: "False"
      - key: SEARCH_GOOGLE_CSE_ENABLED
        value: "False"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_FACTCHECK_API_KEY
        sync: false
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
  - type: cron
    name: newshub-fetch
    env: python
    schedule: "*/30 * * * *"
    buildCommand: pip install -r requirements.txt
    command: python manage.py fetch_news
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"
